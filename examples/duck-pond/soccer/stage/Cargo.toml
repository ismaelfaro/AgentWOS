[workspace]

[package]
name = "duck-soccer-stage"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
# Needle is sensitive to the key order of tool declarations.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
