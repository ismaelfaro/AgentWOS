[workspace]

[package]
name = "director-agentWOS"
version = "0.1.0"
edition = "2021"

[lib]
# Rust wants lower-case library names; the package keeps the display name.
name = "director_agentwos"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
