<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Colony OS</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#22201c; --muted:#7a766e; --line:#dcd7cf; --soft:#efebe5;
          --water:#2b7bb9; --food:#4c9a3c; --energy:#c98a12; --oxygen:#b04a7a; --accent:#a8502d;
          --ok:#3f9e5a; --warn:#d99a1e; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a18; --card:#26241f; --ink:#ece8e1; --muted:#9a958b; --line:#3a372f; --soft:#2f2c26; --accent:#e08a5f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  button, select, input { font:inherit; color:inherit; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .pill { font-size:12px; border-radius:999px; padding:2px 10px; border:1px solid var(--line); color:var(--muted); }
  .pill.live { border-color:var(--ok); color:var(--ok); }
  .pill.done { border-color:var(--muted); }
  .pill.collapse { border-color:var(--bad); color:var(--bad); }
  .kpis { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px; padding:12px 20px 0; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  .kpi span { color:var(--muted); font-size:12px; display:block; }
  .kpi strong { font-size:18px; font-variant-numeric:tabular-nums; }
  .layout { display:grid; grid-template-columns:220px minmax(0,1fr); }
  aside { padding:12px; border-right:1px solid var(--line); min-height:calc(100vh - 130px); }
  aside button { display:block; width:100%; text-align:left; background:none; border:1px solid transparent; padding:7px 10px; border-radius:6px; cursor:pointer; margin-bottom:2px; }
  aside button:hover { background:var(--card); }
  aside button.sel { border-color:var(--accent); background:var(--card); }
  aside small { display:block; color:var(--muted); font-size:12px; }
  .badge { font-size:11px; padding:0 6px; border-radius:4px; margin-left:4px; border:1px solid currentColor; }
  .badge.bad { color:var(--bad); } .badge.warn { color:var(--warn); } .badge.live { color:var(--ok); }
  main { padding:12px 20px 30px; min-width:0; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px; min-width:0; }
  .card h2 { font-size:14px; margin:0 0 8px; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .card h2 small { color:var(--muted); font-weight:400; font-size:12px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .btn.on { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.4; cursor:default; }
  input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); }
  input[type=search], select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  input[type=search] { width:100%; margin:8px 0; }
  .cursor-txt { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:4px 6px; border-bottom:1px solid var(--line); }
  td { padding:6px; border-bottom:1px solid var(--soft); vertical-align:top; }
  tr.action td { color:var(--muted); font-size:12px; padding-top:0; padding-left:21px; }
  tr.row td { border-bottom:0; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .turn { border-left:3px solid var(--line); padding:6px 12px; margin-bottom:10px; }
  .turn.current { border-left-color:var(--accent); background:var(--soft); }
  .turn.blocked { border-left-color:var(--bad); }
  .turn .who { font-weight:600; }
  .turn .meta { color:var(--muted); font-size:12px; margin-left:6px; }
  .turn p { margin:4px 0 0; white-space:pre-wrap; }
  .tag { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 6px; margin:4px 4px 0 0; color:var(--muted); }
  .tag.block, .tag.error { border-color:var(--bad); color:var(--bad); }
  .tag.flag, .tag.modify, .tag.fmt { border-color:var(--warn); color:var(--warn); }
  .feed { max-height:260px; overflow-y:auto; }
  .feed div { padding:5px 0; border-bottom:1px solid var(--soft); font-size:13px; }
  .feed .when { color:var(--muted); font-size:12px; margin-right:6px; font-variant-numeric:tabular-nums; }
  .legend { font-size:12px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:4px; }
  .legend i.dot { width:10px; height:10px; border-radius:50%; }
  svg text { fill:var(--muted); font-size:11px; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  @media (max-width: 980px) { .grid2 { grid-template-columns:1fr; } .kpis { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width: 680px) {
    .layout { grid-template-columns:1fr; }
    aside { min-height:0; border-right:0; border-bottom:1px solid var(--line); display:flex; gap:4px; overflow-x:auto; }
    aside button { width:auto; white-space:nowrap; }
    header, main, .kpis { padding-left:16px; padding-right:16px; }
    .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
</style>
</head>
<body>
<header>
  <h1>Mars Colony OS</h1>
  <span class="pill" id="run-status">waiting for data</span>
  <span class="cursor-txt" id="meta"></span>
</header>
<div class="kpis" id="kpis"></div>
<div class="layout">
  <aside id="days"></aside>
  <main>
    <div class="card">
      <div class="bar">
        <button class="btn" id="b-prev" title="previous turn">&lt;</button>
        <button class="btn on" id="b-play">play</button>
        <button class="btn" id="b-next" title="next turn">&gt;</button>
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="position in the simulation">
        <select id="speed" aria-label="speed">
          <option value="2000">slow</option>
          <option value="1000" selected>normal</option>
          <option value="350">fast</option>
        </select>
        <button class="btn on" id="b-live" title="follow the latest turn as it arrives">live</button>
        <span class="cursor-txt" id="cursor-txt"></span>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>Base map <small>color = status, number = effect of the turn</small></h2>
        <div class="legend">
          <span><i class="dot" style="background:var(--ok)"></i>operating</span>
          <span><i class="dot" style="background:var(--warn)"></i>alert</span>
          <span><i class="dot" style="background:var(--bad)"></i>blocked by control</span>
        </div>
        <div id="map"></div>
      </div>
      <div class="card">
        <h2>Colonists <small>status at the cursor</small></h2>
        <div id="colonists"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>Resources turn by turn <small>% of initial value</small></h2>
        <div class="legend">
          <span><i style="background:var(--water)"></i>water</span>
          <span><i style="background:var(--food)"></i>food</span>
          <span><i style="background:var(--energy)"></i>energy</span>
          <span><i style="background:var(--oxygen)"></i>oxygen</span>
        </div>
        <div id="chart"></div>
      </div>
      <div class="card">
        <h2>OS audit <small id="audit-count"></small></h2>
        <div class="feed" id="audit"></div>
      </div>
    </div>

    <div class="card">
      <h2><span id="day-title">Day</span> <small id="day-status"></small></h2>
      <div class="bar" id="filters"></div>
      <input type="search" id="search" placeholder="search actions...">
      <div id="turns"></div>
    </div>
  </main>
</div>

<script>
const RESOURCES = ["water", "food", "energy", "oxygen"];
const UNIT = { water: "L", food: "kg", energy: "kWh", oxygen: "%" };
const STATUS_COLOR = { operating: "var(--ok)", alert: "var(--warn)", blocked: "var(--bad)" };
const ZONE_POS = {
  greenhouse: [0, 0, "Greenhouse"], medbay: [1, 0, "Medbay"], reactor: [2, 0, "Reactor"],
  water_plant: [0, 1, "Water plant"], habitat: [1, 1, "Central habitat"], outside: [2, 1, "Outside / rover"],
};
const SHORT_UNIT = { water: "L", food: "kg", energy: "kWh", oxygen: "% O2" };

const st = { data: null, signature: "", cursor: 0, live: true, playing: false, timer: null, filter: null, query: "" };

// ---------- DOM helpers (all LLM text goes in as textContent) ----------
function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(children)) if (c !== null && c !== undefined) n.append(c);
  return n;
}
function svgEl(svg, tag, attrs, text) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  svg.append(n);
  return n;
}
function newSvg(w, h) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.style.width = "100%";
  return s;
}
const initials = (name) => name.split(" ").pop().slice(0, 2).toUpperCase();
const fmt = (v, k) => (k === "oxygen" ? v.toFixed(1) : Math.round(v)) + " " + UNIT[k];
const pct = (v, k) => (k === "oxygen" ? v : (v / st.data.initial[k]) * 100);
const zoneLabel = (z) => (ZONE_POS[z] ? ZONE_POS[z][2] : z.replace("_", " "));

// ---------- model: flat list of turns, the cursor indexes into it ----------
function flatTurns() {
  const out = [];
  st.data.days.forEach((d, di) => d.turns.forEach((t, ti) => out.push({ ...t, day: d.day, di, ti })));
  return out;
}
function atCursor() {
  const all = flatTurns();
  const n = Math.min(st.cursor, all.length);
  return { all, seen: all.slice(0, n), current: all[n - 1] || null };
}
function colonistStatus(seen) {
  const m = {};
  for (const c of st.data.agents) m[c.agent] = { ...c, zone: "habitat", status: "operating", action: "", latency_ms: null };
  for (const t of seen) Object.assign(m[t.agent], t);
  return m;
}

// ---------- loading ----------
function load() {
  return new Promise((resolve) => {
    document.getElementById("sim-data")?.remove();
    const s = el("script", { id: "sim-data", src: "../runs/latest.js?t=" + Date.now() });
    s.onload = () => resolve(window.SIM_DATA || null);
    s.onerror = () => resolve(null);
    document.body.append(s);
  });
}

async function refresh() {
  const d = await load();
  const signature = d ? JSON.stringify(d) : "";
  if (signature === st.signature) return;
  st.signature = signature;
  st.data = d;
  if (d && st.live && !st.playing) st.cursor = flatTurns().length;
  render();
}

// ---------- render ----------
function render() {
  const d = st.data;
  const pill = document.getElementById("run-status");
  if (!d) {
    pill.textContent = "no data";
    pill.className = "pill";
    document.getElementById("meta").textContent = "run the host with --manifest examples/mars-colony/manifest.json --colony N";
    return;
  }
  const collapsed = d.days.some((x) => x.collapse);
  pill.textContent = collapsed ? "collapsed" : d.finished ? "finished" : "live";
  pill.className = "pill " + (collapsed ? "collapse" : d.finished ? "done" : "live");
  document.getElementById("meta").textContent =
    `model ${d.model} - controls: ${d.controls.length ? d.controls.join(", ") : "none"}`;

  const c = atCursor();
  renderKpis(c);
  renderBar(c);
  renderDays(c);
  renderMap(c);
  renderColonists(c);
  renderChart(c);
  renderAudit(c);
  renderTurns(c);
}

function renderKpis({ all }) {
  const d = st.data;
  const verdicts = all.flatMap((t) => t.controls);
  const lat = all.map((t) => t.latency_ms).filter((x) => x != null);
  const avg = lat.length ? lat.reduce((a, b) => a + b, 0) / lat.length : 0;
  const formatOk = all.length ? all.filter((t) => t.format_ok).length / all.length : 1;
  const kpis = [
    ["day", `${d.days.length} / ${d.days_total}`],
    ["turns", all.length],
    ["blocks", verdicts.filter((v) => v.verdict === "block").length],
    ["warnings", verdicts.filter((v) => v.verdict === "flag" || v.verdict === "modify").length],
    ["avg latency", (avg / 1000).toFixed(1) + " s"],
    ["valid JSON", Math.round(formatOk * 100) + "%"],
  ];
  document.getElementById("kpis").replaceChildren(...kpis.map(([a, b]) =>
    el("div", { class: "kpi" }, [el("span", {}, a), el("strong", {}, String(b))])));
}

function renderBar({ all, current }) {
  const scrub = document.getElementById("scrub");
  scrub.max = all.length;
  scrub.value = Math.min(st.cursor, all.length);
  document.getElementById("b-prev").disabled = st.cursor <= 0;
  document.getElementById("b-next").disabled = st.cursor >= all.length;
  document.getElementById("b-play").textContent = st.playing ? "pause" : "play";
  document.getElementById("b-live").classList.toggle("on", st.live);
  document.getElementById("cursor-txt").textContent = current
    ? `turn ${st.cursor}/${all.length} - day ${current.day}, ${current.agent}`
    : `start - ${all.length} turns`;
}

function goTo(n, { manual = true } = {}) {
  const total = flatTurns().length;
  st.cursor = Math.max(0, Math.min(n, total));
  if (manual) st.live = st.cursor === total;
  render();
}

function renderDays({ current }) {
  const selectedDay = current ? current.day : null;
  const cont = document.getElementById("days");
  const all = flatTurns();
  cont.replaceChildren(...st.data.days.map((d) => {
    const vs = d.turns.flatMap((t) => t.controls);
    const blocks = vs.filter((v) => v.verdict === "block").length;
    const warns = vs.filter((v) => v.verdict === "flag" || v.verdict === "modify").length;
    const first = all.findIndex((t) => t.day === d.day);
    return el("button", {
      class: d.day === selectedDay ? "sel" : "",
      onclick: () => { pause(); goTo(first < 0 ? st.cursor : first + d.turns.length); },
    }, [
      el("strong", {}, "Day " + d.day),
      d.in_progress ? el("span", { class: "badge live" }, "in progress") : null,
      d.collapse ? el("span", { class: "badge bad" }, "collapse") : null,
      blocks ? el("span", { class: "badge bad" }, blocks + " blocked") : null,
      warns ? el("span", { class: "badge warn" }, warns + " warning") : null,
      el("small", {}, d.event),
    ]);
  }));
}

function effectText(ef) {
  return RESOURCES.filter((k) => ef[k]).map((k) =>
    (ef[k] > 0 ? "+" : "") + (k === "oxygen" ? ef[k] : Math.round(ef[k])) + " " + SHORT_UNIT[k]).join("  ") || "no effect";
}

function renderMap({ seen }) {
  const W = 600, H = 250, CW = 186, CH = 108, GX = 8, GY = 10;
  const svg = newSvg(W, H);
  const effects = Object.fromEntries((st.data.zones || []).map((z) => [z.zone, z.effect]));
  const colonists = colonistStatus(seen);
  const current = atCursor().current;
  for (const [zone, [col, row, name]] of Object.entries(ZONE_POS)) {
    const x = GX + col * (CW + 12), y = GY + row * (CH + 12);
    const active = current && current.zone === zone;
    svgEl(svg, "rect", { x, y, width: CW, height: CH, rx: 8, fill: "var(--card)", stroke: active ? "var(--accent)" : "var(--line)", "stroke-width": active ? 2 : 1 });
    svgEl(svg, "text", { x: x + 8, y: y + 16, "font-size": 12, fill: "var(--ink)" }, name);
    if (effects[zone]) svgEl(svg, "text", { x: x + 8, y: y + CH - 8, "font-size": 10 }, effectText(effects[zone]));
  }
  const byZone = {};
  for (const c of Object.values(colonists)) (byZone[c.zone] ||= []).push(c);
  for (const [zone, list] of Object.entries(byZone)) {
    const [col, row] = ZONE_POS[zone] || ZONE_POS.habitat;
    const cx0 = GX + col * (CW + 12) + CW / 2, cy = GY + row * (CH + 12) + CH / 2 + 2;
    list.forEach((c, i) => {
      const cx = cx0 + (i - (list.length - 1) / 2) * 32;
      if (current && current.agent === c.agent) svgEl(svg, "circle", { cx, cy, r: 17, fill: "none", stroke: "var(--accent)", "stroke-width": 2 });
      svgEl(svg, "circle", { cx, cy, r: 13, fill: STATUS_COLOR[c.status] || "var(--muted)" });
      svgEl(svg, "text", { x: cx, y: cy + 4, "text-anchor": "middle", fill: c.status === "alert" ? "#22201c" : "#fff", "font-size": 11, "font-weight": 600 }, initials(c.agent));
      svgEl(svg, "title", {}, `${c.agent}: ${c.status} in ${zone}`);
    });
  }
  document.getElementById("map").replaceChildren(svg);
}

function renderColonists({ seen, current }) {
  const colonists = Object.values(colonistStatus(seen));
  const rows = colonists.flatMap((c) => {
    const bg = current && current.agent === c.agent ? "background:var(--soft)" : null;
    const action = c.action ? (c.action.length > 110 ? c.action.slice(0, 110) + "..." : c.action) : "no action yet";
    return [
      el("tr", { class: "row", style: bg }, [
        el("td", {}, [el("span", { class: "dot", style: `background:${STATUS_COLOR[c.status] || "var(--muted)"}` }), c.agent]),
        el("td", {}, zoneLabel(c.zone)),
        el("td", {}, c.status),
        el("td", {}, c.latency_ms != null ? (c.latency_ms / 1000).toFixed(1) + " s" : "-"),
      ]),
      el("tr", { class: "action", style: bg }, el("td", { colspan: 4, title: c.action }, action)),
    ];
  });
  document.getElementById("colonists").replaceChildren(el("table", {}, [
    el("thead", {}, el("tr", {}, ["colonist", "zone", "status", "lat."].map((h) => el("th", {}, h)))),
    el("tbody", {}, rows),
  ]));
}

function renderChart({ all }) {
  const cont = document.getElementById("chart");
  if (!all.length) { cont.replaceChildren(el("div", { class: "empty" }, "no turns yet")); return; }
  const points = [{ r: st.data.initial }, ...all.map((t) => ({ r: t.resources_after_turn, t }))];
  const W = 620, H = 220, P = 34;
  const xs = (i) => P + (i * (W - 2 * P)) / Math.max(1, points.length - 1);
  const ys = (v) => H - P - (Math.max(0, Math.min(v, 120)) / 120) * (H - 2 * P);
  const svg = newSvg(W, H);
  for (const g of [0, 50, 100]) {
    svgEl(svg, "line", { x1: P, x2: W - P, y1: ys(g), y2: ys(g), stroke: "var(--line)" });
    svgEl(svg, "text", { x: 2, y: ys(g) + 4 }, g + "%");
  }
  all.forEach((t, i) => {
    if (t.ti === 0) {
      svgEl(svg, "line", { x1: xs(i), x2: xs(i), y1: P - 10, y2: H - P, stroke: "var(--line)", "stroke-dasharray": "3 3" });
      svgEl(svg, "text", { x: xs(i) + 3, y: P - 12 }, "d" + t.day);
    }
  });
  for (const k of RESOURCES) {
    svgEl(svg, "polyline", { points: points.map((p, i) => `${xs(i)},${ys(pct(p.r[k], k))}`).join(" "), fill: "none", stroke: `var(--${k})`, "stroke-width": 2, opacity: 0.35 });
    const seen = points.slice(0, st.cursor + 1);
    svgEl(svg, "polyline", { points: seen.map((p, i) => `${xs(i)},${ys(pct(p.r[k], k))}`).join(" "), fill: "none", stroke: `var(--${k})`, "stroke-width": 2.5 });
  }
  const cx = xs(Math.min(st.cursor, points.length - 1));
  svgEl(svg, "line", { x1: cx, x2: cx, y1: P - 6, y2: H - P, stroke: "var(--accent)", "stroke-width": 1.5 });
  const r = points[Math.min(st.cursor, points.length - 1)].r;
  svgEl(svg, "text", { x: P, y: H - 6 }, RESOURCES.map((k) => k + " " + fmt(r[k], k)).join("   "));
  cont.replaceChildren(svg);
}

function renderAudit({ seen }) {
  const events = [];
  for (const t of seen) {
    for (const v of t.controls) if (v.verdict !== "allow") events.push([t, v.verdict, `${v.module}: ${v.detail || v.verdict}`]);
    if (t.error) events.push([t, "error", t.error]);
    else if (!t.format_ok) events.push([t, "fmt", "reply not valid JSON, zone inferred from text"]);
  }
  document.getElementById("audit-count").textContent = events.length + " events";
  const cont = document.getElementById("audit");
  if (!events.length) { cont.replaceChildren(el("div", { class: "empty" }, "no OS interventions up to the cursor")); return; }
  cont.replaceChildren(...events.reverse().map(([t, kind, text]) => el("div", {}, [
    el("span", { class: "when" }, `d${t.day} - ${t.agent}`),
    el("span", { class: "tag " + kind }, kind),
    " " + text,
  ])));
}

function renderTurns({ current }) {
  const day = current ? st.data.days.find((d) => d.day === current.day) : st.data.days[0];
  const cont = document.getElementById("turns");
  if (!day) { cont.replaceChildren(el("div", { class: "empty" }, "no days simulated yet")); return; }
  document.getElementById("day-title").textContent = `Day ${day.day} - ${day.event}`;
  document.getElementById("day-status").textContent = day.end_state
    ? "end: " + RESOURCES.map((k) => fmt(day.end_state[k], k)).join(", ")
    : "day in progress";

  document.getElementById("filters").replaceChildren(
    el("button", { class: "btn" + (st.filter ? "" : " on"), onclick: () => { st.filter = null; render(); } }, "all"),
    ...st.data.agents.map((c) => el("button", {
      class: "btn" + (st.filter === c.agent ? " on" : ""),
      onclick: () => { st.filter = c.agent; render(); },
    }, c.agent)),
  );

  const limit = current && current.day === day.day ? current.ti + 1 : day.turns.length;
  const q = st.query.trim().toLowerCase();
  const items = day.turns.slice(0, limit)
    .filter((t) => (!st.filter || t.agent === st.filter) && (!q || (t.action || "").toLowerCase().includes(q)))
    .map((t) => {
      const isCurrent = current && current.day === day.day && current.ti === day.turns.indexOf(t);
      return el("div", { class: "turn" + (isCurrent ? " current" : "") + (t.status === "blocked" ? " blocked" : "") }, [
        el("div", {}, [el("span", { class: "who" }, t.agent), el("span", { class: "meta" }, `${zoneLabel(t.zone)} - ${t.status} - ${(t.latency_ms / 1000).toFixed(1)} s`)]),
        el("p", {}, t.error ? t.error : t.action),
        t.delivered && t.delivered !== t.action ? el("p", { class: "meta" }, ["delivered after control: ", t.delivered]) : null,
        el("div", {}, [
          el("span", { class: "tag" }, "effect: " + effectText(t.effect)),
          t.format_ok ? null : el("span", { class: "tag fmt" }, "not valid JSON"),
          ...t.controls.filter((v) => v.verdict !== "allow").map((v) => el("span", { class: "tag " + v.verdict }, `${v.module} ${v.verdict}: ${v.detail}`)),
        ]),
      ]);
    });
  cont.replaceChildren(...(items.length ? items : [el("div", { class: "empty" }, "no turns match")]));
}

// ---------- playback ----------
function play() {
  const total = flatTurns().length;
  if (!total) return;
  if (st.cursor >= total) st.cursor = 0;
  st.playing = true;
  st.live = false;
  clearInterval(st.timer);
  st.timer = setInterval(() => {
    if (st.cursor >= flatTurns().length) { pause(); render(); return; }
    goTo(st.cursor + 1, { manual: false });
  }, Number(document.getElementById("speed").value));
  render();
}
function pause() {
  st.playing = false;
  clearInterval(st.timer);
  st.timer = null;
}

document.getElementById("b-play").addEventListener("click", () => { st.playing ? pause() : play(); render(); });
document.getElementById("b-prev").addEventListener("click", () => { pause(); goTo(st.cursor - 1); });
document.getElementById("b-next").addEventListener("click", () => { pause(); goTo(st.cursor + 1); });
document.getElementById("scrub").addEventListener("input", (e) => { pause(); goTo(Number(e.target.value)); });
document.getElementById("speed").addEventListener("change", () => { if (st.playing) play(); });
document.getElementById("b-live").addEventListener("click", () => { pause(); st.live = true; goTo(flatTurns().length, { manual: false }); });
document.getElementById("search").addEventListener("input", (e) => { st.query = e.target.value; if (st.data) renderTurns(atCursor()); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || !st.data) return;
  if (e.key === "ArrowRight") { pause(); goTo(st.cursor + 1); }
  else if (e.key === "ArrowLeft") { pause(); goTo(st.cursor - 1); }
  else if (e.key === " ") { e.preventDefault(); st.playing ? pause() : play(); render(); }
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
