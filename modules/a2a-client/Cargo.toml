[workspace]

[package]
name = "a2a-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
serde_json = { version = "1", features = ["preserve_order"] }
wstd = { version = "0.6", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
