[workspace]

[package]
name = "llm-call"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wstd = { version = "0.6", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
