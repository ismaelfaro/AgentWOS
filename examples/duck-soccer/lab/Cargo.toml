# The match simulator for the browser lab: the same sim.rs, built as a plain WASM module.
[package]
name = "duck-soccer-lab"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
